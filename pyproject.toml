[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfq-assistant"
version = "0.1.0"
description = "Human-reviewed RFQ intake and quotation preparation assistant for industrial component distributors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # OpenAPI output is checked into the frontend contract. Keep schema
    # generation deterministic across local and CI environments.
    "fastapi==0.128.8",
    "uvicorn>=0.30.0",
    "pydantic==2.13.5",
    "openpyxl>=3.1.5",
    "pypdf>=5.0.0",
    "PyMuPDF>=1.24,<2",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "fpdf2>=2.8.0",
    "rapidfuzz>=3.0.0",
    "defusedxml>=0.7.1",
    "pydantic-ai>=0.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "time-machine>=2.16",
    "ruff>=0.9",
    "mypy>=1.14",
    "bandit>=1.8",
    "pip-audit>=2.7",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["rfq_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
