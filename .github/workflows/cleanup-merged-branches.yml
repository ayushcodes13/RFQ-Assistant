name: Delete branch after merged PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged same-repository feature branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const defaultBranch = context.payload.repository.default_branch;
            if (branch === defaultBranch) {
              core.notice('Refusing to delete the default branch.');
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/' + branch
              });
              core.notice('Deleted merged feature branch: ' + branch);
            } catch (error) {
              if (error.status === 404) {
                core.notice('Branch already deleted: ' + branch);
              } else {
                throw error;
              }
            }
