name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Unit & Schema Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RFQ_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .[test]

      - name: Backend lint and format checks
        run: |
          # Start with syntax/import correctness while the repository-wide
          # legacy naming/import cleanup is tracked separately.
          ruff check rfq_assistant tests scripts --select E4,E7,E9 --ignore E741
          ruff format --check \
            tests/test_ingestion_worker.py \
            tests/test_property_invariants.py \
            tests/test_quotation_validator_contract.py \
            tests/test_catalog_import_edges.py \
            tests/test_persistence_fault_matrix.py \
            tests/test_redis_provider_pacing.py

      - name: Informational type check (ratchet toward zero errors)
        continue-on-error: true
        run: mypy --ignore-missing-imports rfq_assistant

      - name: Run pytest
        run: |
          pytest -v --cov=rfq_assistant --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json --cov-fail-under=80
          python -m scripts.check_coverage coverage.json

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore
          retention-days: 14

  test-frontend:
    name: Frontend Lint, Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run lint, typecheck, and build
        run: |
          cd frontend
          npm run lint
          npm run check:types
          npm run build

  test-e2e:
    name: Full-stack E2E Happy Path
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run E2E happy path
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          cd frontend
          npx playwright test

      - name: Protected workspace browser security check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          # Runtime-only unique user credentials; never commit fixed secrets.
          export RFQ_WORKSPACE_TEST_ADMIN_KEY="$(openssl rand -hex 24)"
          export RFQ_WORKSPACE_TEST_VIEWER_KEY="$(openssl rand -hex 24)"
          export RFQ_WORKSPACE_TEST_ID="ws-ci-test"
          export PILOT_API_KEYS="${RFQ_WORKSPACE_TEST_ADMIN_KEY}:admin:demo-admin:${RFQ_WORKSPACE_TEST_ID}:Demo Administrator,${RFQ_WORKSPACE_TEST_VIEWER_KEY}:viewer:demo-viewer:${RFQ_WORKSPACE_TEST_ID}:Read-Only Auditor"
          export REQUIRE_AUTH=true
          export RFQ_WORKSPACE_SESSION_SECRET="$(openssl rand -hex 48)"
          cd frontend
          npx playwright test e2e/workspace-auth.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security-scans:
    name: Dependency and Python security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and scanners
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install bandit pip-audit

      - name: Audit Python dependencies
        run: pip-audit --skip-editable

      - name: Scan Python source
        run: bandit -r rfq_assistant -ll

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
